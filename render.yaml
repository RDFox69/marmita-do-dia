services:
  - type: web
    name: marmita-em-dia
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/session
    disk:
      name: marmita-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_PATH
        value: /var/data/marmita.sqlite3
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
